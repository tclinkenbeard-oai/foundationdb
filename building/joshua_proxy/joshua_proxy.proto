syntax = "proto3";

package openai.fdbci.joshua_proxy.v1;

// JoshuaProxy exposes Joshua job submission and status lookup APIs.
service JoshuaProxy {
  // Submits a Joshua correctness job and returns a job ID for tracking.
  rpc SubmitJob(SubmitJobRequest) returns (SubmitJobReply);
  // Uploads a correctness tarball to the canonical blob container and returns its URL.
  rpc UploadCorrectnessTarball(stream UploadCorrectnessTarballRequest)
      returns (UploadCorrectnessTarballReply);
  // Returns the current status of a previously submitted job.
  rpc GetJobStatus(GetJobStatusRequest) returns (GetJobStatusReply);
  // Lists Joshua ensembles for a selected listing mode.
  rpc ListEnsembles(ListEnsemblesRequest) returns (ListEnsemblesReply);
}

// Request payload for SubmitJob.
message SubmitJobRequest {
  // Location of the correctness package to run.
  string correctness_package_url = 1;
  // Number of runs to execute.
  uint64 runs = 2;
  // Optional FoundationDB commit hash to persist on the Joshua ensemble.
  string commit_hash = 3;
  // Optional free-form description to persist on the Joshua ensemble.
  string description = 4;
}

// Response payload for SubmitJob.
message SubmitJobReply {
  // Job ID assigned by Joshua.
  string job_id = 1;
}

// Optional metadata sent as the first message in UploadCorrectnessTarball.
message UploadCorrectnessTarballMetadata {
  // Optional original filename (used only to derive a readable blob name suffix).
  string filename = 1;
}

// Streaming request payload for UploadCorrectnessTarball.
message UploadCorrectnessTarballRequest {
  oneof payload {
    // Optional metadata; if present, it must be sent before any chunks.
    UploadCorrectnessTarballMetadata metadata = 1;
    // Tarball bytes. Clients should split large uploads into multiple chunks.
    bytes chunk = 2;
  }
}

// Response payload for UploadCorrectnessTarball.
message UploadCorrectnessTarballReply {
  // Public HTTPS URL to the uploaded correctness tarball blob.
  string correctness_package_url = 1;
  // Blob name (path within the container) created by the proxy.
  string blob_name = 2;
  // Number of bytes uploaded.
  uint64 size_bytes = 3;
}

// Request payload for GetJobStatus.
message GetJobStatusRequest {
  // Job ID returned from SubmitJob.
  string job_id = 1;
}

// Response payload for GetJobStatus.
message GetJobStatusReply {
  // Joshua job identifier.
  string joshua_job_id = 1;
  // Aggregated per-test runtime statistics emitted by TestHarness2 (when available).
  repeated TestRuntimeStat test_runtime_stats = 6;
  // FoundationDB commit hash persisted on the Joshua ensemble (when provided at submit time).
  string commit_hash = 7;
  // Free-form description persisted on the Joshua ensemble (when provided at submit time).
  string description = 8;
  // Joshua ensemble submission timestamp (UTC), when available.
  string submitted = 9;
  // Joshua ensemble stop timestamp (UTC), when available.
  string stopped = 10;
  // Current job status.
  oneof status {
    Success success = 2;
    Cancelled cancelled = 3;
    Running running = 4;
    Failed failed = 5;
  }
}

// Request payload for ListEnsembles.
message ListEnsemblesRequest {
  // Which ensembles should be returned by the list call.
  enum ListMode {
    LIST_MODE_RUNNING = 0;
    LIST_MODE_STOPPED = 1;
    LIST_MODE_ALL = 2;
  }
  // Defaults to LIST_MODE_RUNNING when unset.
  ListMode mode = 1;
  // When true, include per-test runtime_stats from TestHarness2 application results.
  // Leave false for a lighter-weight listing response.
  bool include_test_runtime_stats = 2;
}

// Response payload for ListEnsembles.
message ListEnsemblesReply {
  // Joshua ensembles for the selected list mode.
  repeated JobStatus jobs = 1;
}

// Status summary for a Joshua job.
message JobStatus {
  // Joshua proxy job identifier.
  string job_id = 1;
  // Joshua job identifier.
  string joshua_job_id = 2;
  // Aggregated per-test runtime statistics emitted by TestHarness2 (when available).
  repeated TestRuntimeStat test_runtime_stats = 7;
  // FoundationDB commit hash persisted on the Joshua ensemble (when provided at submit time).
  string commit_hash = 8;
  // Free-form description persisted on the Joshua ensemble (when provided at submit time).
  string description = 9;
  // Joshua ensemble submission timestamp (UTC), when available.
  string submitted = 10;
  // Joshua ensemble stop timestamp (UTC), when available.
  string stopped = 11;
  // Current job status.
  oneof status {
    Success success = 3;
    Cancelled cancelled = 4;
    Running running = 5;
    Failed failed = 6;
  }
}

// Aggregated runtime statistics for a single test across an ensemble.
message TestRuntimeStat {
  // Logical test name (as reported by TestHarness2 runtime_stats).
  string test_name = 1;
  // Number of times this test was run in the ensemble.
  uint64 run_count = 2;
  // Accumulated runtime for this test across runs.
  uint64 total_runtime = 3;
}

// Job status indicating all requested tests completed successfully.
message Success {
  // Count of passing tests.
  uint64 tests_passed = 1;
}

// Job status indicating the job was cancelled.
message Cancelled {
  // Count of passing tests.
  uint64 tests_passed = 1;
  // Count of tests not yet executed.
  uint64 tests_remaining = 2;
}

// Job status indicating the job is still running.
message Running {
  // Count of passing tests.
  uint64 tests_passed = 1;
  // Count of tests not yet executed.
  uint64 tests_remaining = 2;
}

// Job status indicating the job failed.
message Failed {
  // Count of passing tests.
  uint64 tests_passed = 1;
  // Details about failed tests.
  repeated TestFailure failures = 2;
  // Count of failed tests.
  uint64 tests_failed = 3;
}

// Details for an individual test failure.
message TestFailure {
  // Name of the failing test.
  string test_name = 1;
  // Seed used for the failing test.
  uint64 seed = 2;
  // Whether buggify was enabled for the failing test (when known).
  optional bool buggify_enabled = 3;
}

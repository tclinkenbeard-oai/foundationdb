[configuration]
config = 'triple'
singleRegion = true
buggify = false
faultInjection = false

[[knobs]]
enable_native_cdc = true
native_cdc_tag_count = 1
# Triple replication retains at least three 4 KiB replies, which cannot fit this otherwise-valid 8 KiB buffer.
maximum_peek_bytes = 4096
cdc_proxy_buffer_bytes = 8192
cdc_proxy_consume_poll_timeout = 30.0

[[test]]
testTitle = 'NativeCdcRawReplyFanout'
useDB = true
waitForQuiescenceEnd = false
connectionFailuresDisableDuration = 1000000

    [[test.workload]]
    testName = 'NativeCdcEndToEnd'
    initialStreamCount = 1
    minStreamCount = 1
    maxStreamCount = 1
    keyCount = 4
    writesPerRound = 1
    rounds = 0
    testRawReplyFanout = true
    operationTimeout = 120.0

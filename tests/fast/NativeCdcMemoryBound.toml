[configuration]
config = 'single'
singleRegion = true
# Keep the replicated-reader reservation and remote streaming path deterministic for this memory-bound test.
desiredTLogCount = 6
machineCount = 12
processesPerMachine = 1
buggify = false
faultInjection = false

[[knobs]]
enable_native_cdc = true
native_cdc_tag_count = 1
# Allow current and prefetched 4 KiB replies from six TLogs while keeping 32 KiB of stream fanout memory-bound.
cdc_proxy_buffer_bytes = 65536
maximum_peek_bytes = 4096
cdc_proxy_consume_poll_timeout = 30.0

[[test]]
testTitle = 'NativeCdcMemoryBound'
useDB = true
waitForQuiescenceEnd = false
connectionFailuresDisableDuration = 1000000

    [[test.workload]]
    testName = 'NativeCdcEndToEnd'
    initialStreamCount = 32
    minStreamCount = 32
    maxStreamCount = 32
    keyCount = 4
    writesPerRound = 1
    rounds = 1
    testMemoryBound = true
    memoryTestValueBytes = 1024
    drainProbability = 1.0
    delayBetweenRounds = 0.0
    operationTimeout = 120.0
